# DRAFT: outside .github/workflows; not active. Confirm weekly day/time before moving.
name: Skills maintenance candidates
on:
  workflow_dispatch:
  # schedule: insert a user-confirmed weekly UTC cron before activation.
permissions:
  contents: read
concurrency:
  group: skills-maintenance-candidates
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.RAY_SKILLS_MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.25.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm nx run-many -t lint,test,validate,sync-check -p skills-maintenance --skipNxCache
      - run: pnpm nx run skills-maintenance:candidates -- "${RUNNER_TEMP}/skills-candidates"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skills-candidates
          path: ${{ runner.temp }}/skills-candidates/*.json
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: prepare
    if: vars.RAY_SKILLS_MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: skills-maintenance-publish
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: skills-candidates
          path: ${{ runner.temp }}/verified-candidates
      # No package install, candidate script, or Agent executes in this privileged job.
      - run: node tools/skills-maintenance/publish.mjs "${RUNNER_TEMP}/verified-candidates/bundles.json"
        env:
          RAY_SKILLS_PUBLISH: enabled
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
