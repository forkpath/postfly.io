appId: com.ray.mobile.e2e
name: Cold deep link preserves route parameters
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: welcome-login
    timeout: 30000
- stopApp
- openLink:
    link: ray-e2e:///auth/login?email=framework%40example.invalid
    autoVerify: true
# iOS asks for confirmation the first time a fresh simulator opens this scheme.
# autoVerify applies to Android only; keep the route/parameter assertions below.
- runFlow:
    when:
      platform: iOS
      visible: 'Open in .*Ray E2E.*'
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 30000
- assertVisible: framework@example.invalid
- takeScreenshot: deep-link
