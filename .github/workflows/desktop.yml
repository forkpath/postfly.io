name: Desktop checks
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2025
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NX_NO_CLOUD: 'true'
      DESKTOP_ARCH: ${{ matrix.arch }}
      VITE_URL: https://example.com
      VITE_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t lint,typecheck,test,build -p desktop
      - run: pnpm nx run desktop:e2e
      - run: pnpm nx run desktop:smoke
      - run: pnpm nx run desktop:update-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-tests-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/desktop/test-results
          if-no-files-found: warn
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_NO_CLOUD: 'true'
      DESKTOP_S3_ENDPOINT: http://127.0.0.1:9000
      DESKTOP_S3_BUCKET: ray-desktop-test
      AWS_ACCESS_KEY_ID: ray-test
      AWS_SECRET_ACCESS_KEY: ray-test-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker run -d --name ray-minio -p 9000:9000 -e MINIO_ROOT_USER=ray-test -e MINIO_ROOT_PASSWORD=ray-test-password minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
      - run: curl --retry 20 --retry-delay 1 --retry-all-errors --fail http://127.0.0.1:9000/minio/health/live
      - run: pnpm nx run desktop:publish-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-storage-tests
          path: dist/desktop/test-results/publish
          if-no-files-found: warn
