name: Deploy

on:
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  verify-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: |
          git fetch origin main --depth=1
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" FETCH_HEAD; then
            echo "::error::Tag must be on main branch"
            exit 1
          fi

  deploy:
    needs: verify-branch
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euxo pipefail

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            DEPLOY_PATH="${{ vars.DEPLOY_PATH || '/opt/ray' }}"
            RELEASE_TAG="${{ github.ref_name }}"

            echo "== Runtime context =="
            whoami
            echo "HOME=$HOME"
            echo "node=$(node -v 2>/dev/null || echo 'NOT FOUND')"
            echo "pnpm=$(pnpm -v 2>/dev/null || echo 'NOT FOUND')"
            pwd

            cd "$DEPLOY_PATH"

            echo "== Repository info =="
            git remote -v
            git status --short --branch || true

            echo "== Fetching tags =="
            git fetch --tags origin

            echo "== Verifying tag exists locally =="
            git rev-parse -q --verify "refs/tags/$RELEASE_TAG"

            echo "== Checking out release tag =="
            git checkout -B "release-$RELEASE_TAG" "refs/tags/$RELEASE_TAG"

            echo "== Building and restarting services =="
            ./scripts/deploy.sh build
            ./scripts/deploy.sh restart
