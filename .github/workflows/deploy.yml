name: Deploy Ray

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Ensure selected release belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git merge-base --is-ancestor "$tag_commit" FETCH_HEAD

  build-and-push:
    needs: verify-branch
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_USER: ray_release
          POSTGRES_PASSWORD: ray_release_password
          POSTGRES_DB: ray_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ray_release -d ray_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DATABASE_URL: postgresql://ray_release:ray_release_password@127.0.0.1:5432/ray_release
      VITE_URL: ${{ vars.PUBLIC_ORIGIN }}
      VITE_API_BASE_URL: ${{ vars.PUBLIC_ORIGIN }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
    outputs:
      engine: ${{ steps.engine.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
      pulse: ${{ steps.pulse.outputs.digest }}
      worker: ${{ steps.worker.outputs.digest }}
      migrator: ${{ steps.migrator.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check public build configuration
        run: |
          test -n "$VITE_URL" || { echo 'Set the PUBLIC_ORIGIN repository variable'; exit 1; }
          test -n "$CONTACT_EMAIL" || { echo 'Set the CONTACT_EMAIL repository variable'; exit 1; }
      - name: Initialize a fresh database
        run: pnpm nx run pg-dao:deploy
      - name: Full release verification
        run: pnpm nx run-many -t lint,typecheck,test,build --all
      - name: Validate database and auth contracts
        run: pnpm nx run-many -t validate,schema-check -p pg-dao,auth-server --nxBail
      - name: Prove Prisma generation does not mutate the auth contract
        run: |
          pnpm nx run pg-dao:generate
          git diff --exit-code -- libs/pg-dao/src/models/auth.prisma
      - name: Prepare server runtime artifacts
        run: pnpm nx run-many -t package -p engine,pulse,worker
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: engine
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/engine.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/engine:${{ github.sha }}
      - id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
      - id: pulse
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/pulse.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/pulse:${{ github.sha }}
      - id: worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/worker:${{ github.sha }}
      - id: migrator
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/migrator.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/migrator:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Upload versioned deployment control files
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          source: docker/docker-compose.infra.yml,docker/docker-compose.app.yml,docker/kong/kong.yml,docker/kong/entrypoint.sh,docker/kong/tls-plugins.yml,docker/mongo/init-db.js,scripts/release/deploy.sh
          target: ${{ vars.DEPLOY_PATH || '/opt/ray' }}
      - name: Apply schema and start services behind Kong
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/ray' }}
          ENGINE_IMAGE: ${{ env.IMAGE_PREFIX }}/engine@${{ needs.build-and-push.outputs.engine }}
          WEB_IMAGE: ${{ env.IMAGE_PREFIX }}/web@${{ needs.build-and-push.outputs.web }}
          PULSE_IMAGE: ${{ env.IMAGE_PREFIX }}/pulse@${{ needs.build-and-push.outputs.pulse }}
          WORKER_IMAGE: ${{ env.IMAGE_PREFIX }}/worker@${{ needs.build-and-push.outputs.worker }}
          MIGRATOR_IMAGE: ${{ env.IMAGE_PREFIX }}/migrator@${{ needs.build-and-push.outputs.migrator }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          envs: DEPLOY_PATH,ENGINE_IMAGE,WEB_IMAGE,PULSE_IMAGE,WORKER_IMAGE,MIGRATOR_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            chmod +x "$DEPLOY_PATH/scripts/release/deploy.sh"
            "$DEPLOY_PATH/scripts/release/deploy.sh"
