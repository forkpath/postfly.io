# Run only through scripts/testing/run-backend.mjs. No development volumes/ports.
services:
  postgres:
    image: docker.io/library/postgres:17@sha256:2203e6282d9e7de7c24d7da234e2a744fb325df366a3fd8ed940e8abbee39527
    environment:
      POSTGRES_USER: ray_test
      POSTGRES_PASSWORD: ${RAY_TEST_PASSWORD:?}
      POSTGRES_DB: ${RAY_TEST_DATABASE:?}
    ports: ['127.0.0.1::5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ray_test -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 45
  redis:
    image: docker.io/library/redis:7.4@sha256:33d7c9a245edd95e6703a0addbeaa48fe40c3b3b4783627a72085155462ebfdb
    command: ['redis-server', '--requirepass', '${RAY_TEST_PASSWORD:?}']
    environment:
      REDISCLI_AUTH: ${RAY_TEST_PASSWORD:?}
    ports: ['127.0.0.1::6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 45
  mongo:
    image: docker.io/library/mongo:8.0@sha256:45b422ba19c0f028a917ea43746ab8e8cdbdaaeb50d2e6e634a17c59666e0dbb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${RAY_TEST_PASSWORD:?}
      MONGO_INITDB_DATABASE: ${RAY_TEST_DATABASE:?}
      RAY_TEST_PASSWORD: ${RAY_TEST_PASSWORD:?}
    volumes:
      - ./test/mongo-init.js:/docker-entrypoint-initdb.d/01-test-user.js:ro
    ports: ['127.0.0.1::27017']
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet -u ray_test -p "$$RAY_TEST_PASSWORD" --authenticationDatabase "$$MONGO_INITDB_DATABASE" --eval "db.adminCommand({ping:1}).ok"']
      interval: 5s
      timeout: 20s
      retries: 45
  rabbitmq:
    image: docker.io/library/rabbitmq:4.0.1-management@sha256:9b471f8528a5beee7a6913d49bc450ffd92b3d0d9732f8febc448d291f5d150b
    environment:
      RABBITMQ_DEFAULT_USER: ray_test
      RABBITMQ_DEFAULT_PASS: ${RAY_TEST_PASSWORD:?}
      RABBITMQ_DEFAULT_VHOST: ${RAY_TEST_DATABASE:?}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '+S 2:2 +A 4'
      RABBITMQ_CTL_ERL_ARGS: '+S 1:1 +A 1'
    ports: ['127.0.0.1::5672', '127.0.0.1::15672']
    healthcheck:
      test: ['CMD', 'gosu', 'rabbitmq', 'rabbitmq-diagnostics', '-q', 'check_running']
      start_period: 30s
      interval: 10s
      timeout: 20s
      retries: 45
