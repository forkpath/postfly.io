name: ${COMPOSE_PROJECT_NAME:-ray}

networks:
  ray-net:
    driver: bridge

services:
  redis:
    image: redis:7.4
    networks: [ray-net]
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes: [redis:/data]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17
    networks: [ray-net]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:8.0
    networks: [ray-net]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongo:/data/db
      - ./mongo/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.0.1-management
    networks: [ray-net]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASSWORD}
    volumes: [rabbitmq:/var/lib/rabbitmq]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 5s
      retries: 5

  kong:
    image: kong:3.9
    networks: [ray-net]
    ports: ['${GATEWAY_HTTP_PORT:-80}:8000', '${GATEWAY_HTTPS_PORT:-443}:8443']
    entrypoint: ['/entrypoint.sh']
    environment:
      KONG_DATABASE: 'off'
      KONG_NGINX_WORKER_PROCESSES: ${KONG_WORKERS:-2}
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ADMIN_LISTEN: 'off'
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENGINE_UPSTREAM: engine:8000
      PULSE_UPSTREAM: pulse:3001
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      REDIS_HOST: redis
      KONG_AUTO_TLS: ${KONG_AUTO_TLS:-false}
      WEB_UPSTREAM: web:3000
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml.template:ro
      - ./kong/entrypoint.sh:/entrypoint.sh:ro
      - ./kong/tls-plugins.yml:/etc/kong/tls-plugins.yml.template:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis:
  postgres:
  mongo:
  rabbitmq:
