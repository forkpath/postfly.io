networks:
  ray-net:
    external: false
    driver: bridge

services:
  # ═══════════════════════════════════════════════════════════════
  #  Infrastructure
  # ═══════════════════════════════════════════════════════════════

  redis:
    image: redis:7.4
    container_name: ${RAY_DEV_NAMESPACE:-ray}-redis
    networks: [ray-net]
    ports: ['127.0.0.1:${REDIS_PORT:-6379}:6379']
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes', '--tcp-keepalive', '60']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17
    container_name: ${RAY_DEV_NAMESPACE:-ray}-postgres
    networks: [ray-net]
    ports: ['127.0.0.1:${POSTGRES_PORT:-5432}:5432']
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:8.0
    container_name: ${RAY_DEV_NAMESPACE:-ray}-mongo
    networks: [ray-net]
    ports: ['127.0.0.1:${MONGO_PORT:-27017}:27017']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongo:/data/db
      - ./mongo/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.0.1-management
    container_name: ${RAY_DEV_NAMESPACE:-ray}-rabbitmq
    networks: [ray-net]
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASSWORD}
      # Share laptop CPUs with TypeScript/Vite instead of starting one scheduler
      # per Docker VM CPU. Deployment sizing remains in the infra Compose file.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '${RABBITMQ_DEV_ERL_ARGS:-+S 2:2 +A 4 +sbwt none +sbwtdcpu none +sbwtdio none}'
      RABBITMQ_CTL_ERL_ARGS: '+S 1:1 +A 1'
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      # The CLI boots its own VM; first-time app compilation shares laptop CPUs.
      interval: 30s
      timeout: 15s
      retries: 5

  kong:
    image: kong:3.9
    networks: [ray-net]
    ports: ['${GATEWAY_DEV_PORT:-8080}:8000']
    extra_hosts: ['host.docker.internal:host-gateway']
    entrypoint: ['/entrypoint.sh']
    environment:
      KONG_DATABASE: 'off'
      # Vite serves hundreds of source modules per page in development.
      KONG_RATE_LIMIT_MINUTE: ${KONG_DEV_RATE_LIMIT_MINUTE:-10000}
      KONG_NGINX_WORKER_PROCESSES: ${KONG_WORKERS:-2}
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ADMIN_LISTEN: 'off'
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      PUBLIC_ORIGIN: http://localhost:${GATEWAY_DEV_PORT:-8080}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENGINE_UPSTREAM: host.docker.internal:${ENGINE_PORT:-8000}
      PULSE_UPSTREAM: host.docker.internal:${PULSE_PORT:-3001}
      WEB_UPSTREAM: host.docker.internal:${WEB_PORT:-3000}
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml.template:ro
      - ./kong/entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis:
    name: ${RAY_DEV_NAMESPACE:-ray}-redis
  postgres:
    name: ${RAY_DEV_NAMESPACE:-ray}-postgres
  mongo:
    name: ${RAY_DEV_NAMESPACE:-ray}-mongo
  rabbitmq:
    name: ${RAY_DEV_NAMESPACE:-ray}-rabbitmq
