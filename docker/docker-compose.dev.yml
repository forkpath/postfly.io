networks:
  ray-net:
    external: false
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/16
          gateway: 10.10.0.1

services:
  # ═══════════════════════════════════════════════════════════════
  #  Infrastructure
  # ═══════════════════════════════════════════════════════════════

  redis:
    image: redis:7.4
    container_name: ray-redis
    networks: [ray-net]
    ports: ['6379:6379']
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes', '--tcp-keepalive', '60']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17
    container_name: ray-postgres
    networks: [ray-net]
    ports: ['5432:5432']
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:8.0
    container_name: ray-mongo
    networks: [ray-net]
    ports: ['27017:27017']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongo:/data/db
      - ./mongo/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.0.1-management
    container_name: ray-rabbitmq
    networks: [ray-net]
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASSWORD}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 5s
      retries: 5

  kong:
    image: kong:3.9
    networks: [ray-net]
    ports: ['${GATEWAY_DEV_PORT:-8080}:8000']
    extra_hosts: ['host.docker.internal:host-gateway']
    entrypoint: ['/entrypoint.sh']
    environment:
      KONG_DATABASE: 'off'
      KONG_NGINX_WORKER_PROCESSES: ${KONG_WORKERS:-2}
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ADMIN_LISTEN: 'off'
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      PUBLIC_ORIGIN: http://localhost:${GATEWAY_DEV_PORT:-8080}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENGINE_UPSTREAM: host.docker.internal:${ENGINE_PORT:-8000}
      PULSE_UPSTREAM: host.docker.internal:${PULSE_PORT:-3001}
      WEB_UPSTREAM: host.docker.internal:${WEB_PORT:-3000}
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml.template:ro
      - ./kong/entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis:
    name: ray-redis
  postgres:
    name: ray-postgres
  mongo:
    name: ray-mongo
  rabbitmq:
    name: ray-rabbitmq
