# Overlay on docker-compose.test.yml, scoped to its unique disposable namespace.
x-runtime: &runtime
  NODE_ENV: production
  POSTGRES_DATABASE_URL: postgresql://ray_test:${RAY_TEST_PASSWORD}@postgres:5432/${RAY_TEST_DATABASE}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${RAY_TEST_PASSWORD}
  MONGO_HOST: mongo
  MONGO_PORT: 27017
  MONGO_INITDB_ROOT_USERNAME: ray_test
  MONGO_INITDB_ROOT_PASSWORD: ${RAY_TEST_PASSWORD}
  MONGO_INITDB_DATABASE: ${RAY_TEST_DATABASE}
  RABBITMQ_URI: amqp://ray_test:${RAY_TEST_PASSWORD}@rabbitmq:5672/${RAY_TEST_DATABASE}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: http://127.0.0.1:4178
  LOGGER_FILE_ENABLED: 'false'
  LOGGER_FILE_COMPRESS: 'false'
  LOGGER_LEVEL: warn
  EMAIL_FROM: framework-test@example.invalid

services:
  engine:
    image: ${RAY_RELEASE_IMAGE_PREFIX:?}/engine:${RAY_RELEASE_IMAGE_TAG:?}
    environment:
      <<: *runtime
      ENGINE_PORT: 8000
    ports: ['127.0.0.1::8000']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8000/api/v1/health || exit 1']
      interval: 3s
      timeout: 5s
      retries: 30
  pulse:
    image: ${RAY_RELEASE_IMAGE_PREFIX:?}/pulse:${RAY_RELEASE_IMAGE_TAG:?}
    environment:
      <<: *runtime
      PULSE_PORT: 3001
    ports: ['127.0.0.1::3001']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/ready || exit 1']
      interval: 3s
      timeout: 5s
      retries: 30
  worker:
    image: ${RAY_RELEASE_IMAGE_PREFIX:?}/worker:${RAY_RELEASE_IMAGE_TAG:?}
    environment:
      <<: *runtime
      WORKER_PORT: 3002
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3002/ready || exit 1']
      interval: 3s
      timeout: 5s
      retries: 30
  web:
    image: ${RAY_RELEASE_IMAGE_PREFIX:?}/web:${RAY_RELEASE_IMAGE_TAG:?}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      API_BASE_URL: http://engine:8000
    ports: ['127.0.0.1::3000']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ || exit 1']
      interval: 3s
      timeout: 5s
      retries: 30
  migrator:
    image: ${RAY_RELEASE_IMAGE_PREFIX:?}/migrator:${RAY_RELEASE_IMAGE_TAG:?}
    environment:
      POSTGRES_DATABASE_URL: postgresql://ray_test:${RAY_TEST_PASSWORD}@postgres:5432/${RAY_TEST_DATABASE}
