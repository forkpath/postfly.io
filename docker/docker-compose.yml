version: '3.8'
networks:
  ray-net:
    external: false
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/16
          gateway: 10.10.0.1

services:
  redis:
    image: redis:latest
    container_name: redis
    networks:
      - ray-net
    ports:
      - '6379:6379'
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD}',
        '--appendonly',
        'yes',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis:/data

  postgres:
    image: postgres:17
    container_name: postgres
    networks:
      - ray-net
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data

  mongo:
    image: mongo:latest
    container_name: mongo
    networks:
      - ray-net
    ports:
      - '27017:27017'
    command: ['mongod', '--auth', '--bind_ip_all']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongo:/data/db
      - ./mongo/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro

  rabbitmq:
    image: rabbitmq:4.0.1-management
    container_name: rabbitmq
    networks:
      - ray-net
    ports:
      - '5672:5672'
      - '15672:15672'
      # - "5671:5761" TLS/SSL api
      # - "15671:15671" https ui
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASSWORD}
    volumes:
      - rabbitmq:/var/lib/rabbitmq

volumes:
  redis:
    name: ray-redis
  postgres:
    name: ray-postgres
  mongo:
    name: ray-mongo
  rabbitmq:
    name: ray-rabbitmq
