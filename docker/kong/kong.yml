_format_version: '3.0'
_transform: true

services:
  # ─── Engine (NestJS API) ──────────────────────────────────────
  - name: engine-api
    url: http://${ENGINE_UPSTREAM}
    routes:
      - name: engine-api-route
        paths:
          - /api
        strip_path: false
        preserve_host: true
        protocols:
          - http
          - https
    plugins:
      - name: cors
        config:
          origins:
            - ${PUBLIC_ORIGIN}
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Content-Type
            - Authorization
            - Accept
            - Cookie
          credentials: true
          max_age: 3600

  # ─── Auth (Better Auth via Engine) ────────────────────────────
  - name: engine-auth
    url: http://${ENGINE_UPSTREAM}
    routes:
      - name: engine-auth-route
        paths:
          - /api/auth
        strip_path: false
        preserve_host: true
        protocols:
          - http
          - https

  # Pulse uses the HTTP WebSocket upgrade on /ws. Preserve the path.
  - name: pulse-websocket
    url: http://${PULSE_UPSTREAM}
    read_timeout: 3600000
    write_timeout: 3600000
    routes:
      - name: pulse-websocket-route
        paths: [/ws]
        strip_path: false
        preserve_host: true
        protocols: [http, https]

  # ─── Web (TanStack Start SSR + SPA) ──────────────────────────
  - name: web-ssr
    url: http://${WEB_UPSTREAM}
    routes:
      - name: web-catch-all
        paths:
          - /
        strip_path: false
        preserve_host: true
        protocols:
          - http
          - https

plugins:
  # ─── Rate limiting ───────────────────────────────────────────
  - name: rate-limiting
    config:
      minute: 200
      policy: redis
      redis:
        host: ${REDIS_HOST}
        port: 6379
        password: ${REDIS_PASSWORD}
        database: 2
      fault_tolerant: true
      hide_client_headers: false
