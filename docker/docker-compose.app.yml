name: ray-${DEPLOY_COLOR:?DEPLOY_COLOR is required}

networks:
  ray-net:
    external: true
    name: ray-net

x-service-environment: &service-environment
  NODE_ENV: production
  REDIS_HOST: ray-redis
  MONGO_HOST: ray-mongo
  POSTGRES_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ray-postgres:5432/${POSTGRES_DB}?connect_timeout=30&sslmode=disable
  RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASSWORD}@ray-rabbitmq:5672

services:
  engine:
    image: ${ENGINE_IMAGE:?ENGINE_IMAGE digest reference is required}
    container_name: ray-engine-${DEPLOY_COLOR}
    networks:
      ray-net:
        aliases: ['engine-${DEPLOY_COLOR}']
    env_file: ../.env
    environment:
      <<: *service-environment
      ENGINE_PORT: 8000
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  pulse:
    image: ${PULSE_IMAGE:?PULSE_IMAGE digest reference is required}
    container_name: ray-pulse-${DEPLOY_COLOR}
    networks:
      ray-net:
        aliases: ['pulse-${DEPLOY_COLOR}']
    env_file: ../.env
    environment:
      <<: *service-environment
      PULSE_PORT: 3001
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE digest reference is required}
    container_name: ray-worker-${DEPLOY_COLOR}
    networks:
      ray-net:
        aliases: ['worker-${DEPLOY_COLOR}']
    env_file: ../.env
    environment:
      <<: *service-environment
      WORKER_PROCESSORS: ${WORKER_PROCESSORS:-all}
      WORKER_QUEUES: ${WORKER_QUEUES:-platform.smoke}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_PORT: 3002
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3002/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE digest reference is required}
    container_name: ray-web-${DEPLOY_COLOR}
    networks:
      ray-net:
        aliases: ['web-${DEPLOY_COLOR}']
    env_file: ../.env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
